syntax = "proto3";

package idtxcore;

import "transform.proto";
import "session.proto";
import "prim.proto";

message Handshake {
  string session_id = 1;
  string session_layer = 2;
  string usd_path = 3;
  string usd_uri = 4;
}

// Terminal marker of a snapshot: the server sends one TransformBroadcast per
// prim with authored session-layer overrides (and the creation and active
// frames that go with them), then a single SnapshotComplete so the client
// knows it has the full current state. A snapshot is sent when a client joins,
// and when it asks for one with SnapshotRequest; BaseMessage.request_id of
// the SnapshotComplete then echoes the request's, and is 0 after a join.
message SnapshotComplete {
}

// Client -> server: send me a snapshot of the session's current state now,
// for example after rebuilding the stage on LayerReloaded. Set
// BaseMessage.request_id to match the SnapshotComplete that ends it. The
// snapshot is taken in the session's command order, like any command; a
// request the session cannot accept is answered with a not-ok Ack instead.
message SnapshotRequest {
}

// A file the session's stage uses (its root file, or one of its sublayers,
// references or payloads) changed on the server, through a commit of any
// session or an upload that replaced it, and the server has reloaded it.
// Clients re-fetch that one file (evicting any cached copy of usd_uri) and
// rebuild what they show from it. A rebuilt stage no longer holds the
// session's edits, so they then send SnapshotRequest. Stage frames received
// until that snapshot can be ignored: the file and the snapshot supersede
// them. server_seq is the session's version after the reload.
message LayerReloaded {
  // Uploads-relative path of the reloaded file, as in Handshake.usd_path.
  string usd_path = 1;
  // Server-relative download URI of that file, built like Handshake.usd_uri.
  string usd_uri = 2;
}

// Ordering:
//   - Every session processes incoming commands strictly one at a time, in the
//     order the server received them. That order is authoritative.
//   - server_seq is a per-session version counter. It is incremented once for
//     every stage change the server applies. Server messages that reflect
//     stage state (TransformBroadcast, Ack, SnapshotComplete) carry the
//     server_seq of the state they describe, so clients can order them and
//     detect stale data. The values a client receives never go down, but
//     several messages can share one value (an update's Ack and its
//     broadcasts, all frames of a join snapshot). 0 means "no state": it is
//     used by messages that do not reflect state and by Acks of rejected
//     updates (queue_full, session_closing); clients ignore it for ordering.
//     A correction (see Ack) is a TransformBroadcast sent to one client only;
//     it advances server_seq without changing the stage, so other clients can
//     see gaps in the values they receive.
//   - On a TransformUpdate sent by a client, server_seq is the base of the
//     update: the highest server_seq the client had received and applied when
//     it created the update. The server rejects the update as "stale" if the
//     prim was changed by someone else after the base, and as "invalid_base"
//     if the base is higher than any server_seq sent to that client. 0 is a
//     valid base (the state before the first change) and is checked like any
//     other value.
//   - request_id is chosen by the client for each TransformUpdate (for example
//     a per-connection counter) and echoed back unchanged in the matching Ack;
//     for a SnapshotRequest it is echoed in the SnapshotComplete that ends the
//     requested snapshot. 0 means "not set".
message BaseMessage {
  optional string session_id = 1;
  oneof message {
    Handshake handshake = 2;
    TransformUpdate xform_update = 3;
    TransformBroadcast xform_broadcast = 4;
    Ack ack = 5;
    Error error = 6;
    SnapshotComplete snapshot_complete = 7;
    // Prim lifecycle broadcasts (server -> clients). Tags match idtx-core's
    // BaseMessage oneof. The matching requests (create_prim = 10,
    // set_prim_active = 12) are outbound-only and not produced by this client
    // yet, so their arms are omitted here; the broadcast arms the client
    // receives keep the server's tag numbers.
    CreatePrimBroadcast create_prim_broadcast = 11;
    SetPrimActiveBroadcast set_prim_active_broadcast = 13;
    LayerReloaded layer_reloaded = 14;
    SnapshotRequest snapshot_request = 15;
  }
  uint64 request_id = 8;
  uint64 server_seq = 9;
}
