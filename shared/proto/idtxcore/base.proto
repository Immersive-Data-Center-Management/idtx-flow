syntax = "proto3";

package idtxcore;

import "transform.proto";
import "session.proto";

message Handshake {
  string session_id = 1;
  string session_layer = 2;
  string usd_path = 3;
  string usd_uri = 4;
}

// Terminal marker of the late-joiner snapshot: the server sends one
// TransformBroadcast per prim with authored session-layer overrides, then a
// single SnapshotComplete so the client knows it has the full current state.
message SnapshotComplete {
}

message BaseMessage {
  optional string session_id = 1;
  oneof message {
    Handshake handshake = 2;
    TransformUpdate xform_update = 3;
    TransformBroadcast xform_broadcast = 4;
    Ack ack = 5;
    Error error = 6;
    SnapshotComplete snapshot_complete = 7;
  }
}